name: Deploy ShipOps to Linux PC

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Test Tailscale connection
        run: |
          echo "Tailscale status:"
          tailscale status

          echo "Test connection to Linux PC:"
          ping -c 3 ${{ secrets.LINUX_HOST }}

      - name: Deploy to Linux PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINUX_HOST }}
          username: ${{ secrets.LINUX_USER }}
          key: ${{ secrets.LINUX_SSH_KEY }}
          script: |
            set -e

            echo "Go to project folder..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "Current folder:"
            pwd

            echo "Current branch:"
            git branch --show-current

            echo "Sync latest code from triggering branch..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "Rebuild and restart Docker Compose..."
            docker compose --env-file .env.production up -d --build

            echo "Clean old Docker images..."
            docker image prune -f

            echo "Deployment result:"
            docker compose --env-file .env.production ps
