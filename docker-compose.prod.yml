services:
  db:
    image: postgres:16-alpine
    container_name: shipper_postgres_prod
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shipper_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipper_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: shipper_fastapi_prod
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      CREATE_ALL_ON_STARTUP: ${CREATE_ALL_ON_STARTUP}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - shipper_uploads_prod:${UPLOAD_FOLDER}
    networks:
      - shipper_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_MAP_MODE: ${NEXT_PUBLIC_MAP_MODE}
        NEXT_PUBLIC_PMTILES_URL: ${NEXT_PUBLIC_PMTILES_URL}
    container_name: shipper_nextjs_prod
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_MAP_MODE: ${NEXT_PUBLIC_MAP_MODE}
      NEXT_PUBLIC_PMTILES_URL: ${NEXT_PUBLIC_PMTILES_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - shipper_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shipper_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - ./.env.production
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - shipper_net

volumes:
  shipper_pgdata_prod:
  shipper_uploads_prod:

networks:
  shipper_net:
    driver: bridge
